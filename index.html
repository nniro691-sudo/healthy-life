<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#25231d"/><title>山寺 · 清心一隅</title><link rel="preload" as="image" href="/assets/shakyamuni-gold-hd.png" fetchpriority="high"/></head><body><div id="app">
<div id="environment"></div><div class="scene-shade"></div><canvas id="world" aria-label="寺庙场景，点击石板地面行走，拖动环顾"></canvas>
<header><a class="brand" href="./" aria-label="山寺首页"><span class="brand-seal" data-icon="temple"></span><strong>山寺</strong></a><span class="brand-note">清心一隅 · 自在修行</span><div class="top-actions"><button id="online-status" class="online-status" data-connection="reconnecting" aria-label="在线同修与邀请">正在连接同修…</button><button id="sound" class="round" aria-label="开启环境声音" title="环境声音"><i data-icon="volume-x"></i></button><button id="settings" class="round" aria-label="设置"><i data-icon="sliders-horizontal"></i></button></div></header>
<div class="location"><span></span><h1 id="scene-name">大雄宝殿</h1><span></span><p id="scene-poem">一念清净，万般自在</p></div>
<nav class="scene-nav" aria-label="寺庙场景"><div class="nav-line"></div><button data-scene="gate"><i data-icon="door-open"></i><span>山门</span><small>01</small></button><button data-scene="court"><i data-icon="trees"></i><span>庭院</span><small>02</small></button><button data-scene="hall" class="active"><i data-icon="temple"></i><span>大雄宝殿</span><small>03</small></button><button data-scene="tree"><i data-icon="leaf"></i><span>许愿树</span><small>04</small></button><div class="nav-foot">随心而行 · 步步生莲</div></nav>
<div class="practice-summary"><span class="sun-mark">◌</span><div><small>今日修行</small><p><b id="merit">0</b><span>次</span></p></div><button id="record" aria-label="查看修行记录"><i data-icon="chevron-right"></i></button></div>
<div class="scene-quote"><span>静</span><p>心有一方净土<br/>何处不是山水</p></div>
<div id="walk-hint" class="walk-hint"><i data-icon="mouse-pointer-2"></i><span>拖动环顾 · 点击行走 · 滚轮缩放</span></div>
<div id="character-label" class="character-label">自在小僧</div><div id="destination"></div>
<div class="bottom-area"><div class="status-line"><span class="breath-dot"></span><span id="status">此刻，只管让心慢下来</span></div><nav class="practice-bar" aria-label="修行方式"><button data-practice="incense"><i data-icon="flame"></i><span>上香</span></button><span class="divider"></span><button data-practice="palms"><i data-icon="pray"></i><span>合掌</span></button><span class="divider"></span><button data-practice="bow"><i data-icon="kneel"></i><span>跪拜</span></button><span class="divider"></span><button data-practice="wood"><i data-icon="woodfish"></i><span>木鱼</span></button><span class="divider"></span><button data-practice="beads"><i data-icon="circle-dot-dashed"></i><span>念珠</span></button></nav><p class="bottom-caption">一方山寺，安放此刻的心</p></div>
<button id="route" class="route-button"><i data-icon="route"></i><span>路线</span></button><button id="wish-shortcut" class="wish-shortcut" hidden><i data-icon="ribbon"></i> 留下心愿</button>
<div id="toast" role="status"></div><div id="transition"><span>山寺</span><p>心随步履，渐入清境</p></div>
<div class="camera-tools"><button id="camera-reset" aria-label="复位视角">复位视角</button><button id="camera-left" aria-label="向左环顾">左看</button><button id="camera-right" aria-label="向右环顾">右看</button><button id="camera-near" aria-label="拉近视角">＋</button><button id="camera-far" aria-label="拉远视角">－</button></div><div class="movement-pad" aria-label="行走控制"><button data-move="w" aria-label="向前走">↑</button><button data-move="a" aria-label="向左走">←</button><button data-move="s" aria-label="向后走">↓</button><button data-move="d" aria-label="向右走">→</button></div><div id="modal-root"></div><div id="loading"><div class="loading-seal">山寺</div><p>一念入山 · 片刻清宁</p><span></span></div>
</div><script type="module" src="/src/main.js"></script></body></html>
